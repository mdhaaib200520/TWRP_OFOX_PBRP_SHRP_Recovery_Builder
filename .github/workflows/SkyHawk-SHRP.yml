name: SkyHawk [SHRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: 'SHRP Manifest URL'
        required: true
        default: 'https://github.com/SHRP/manifest.git'
      MANIFEST_BRANCH:
        description: 'SHRP Manifest Branch'
        required: true
        default: 'shrp-12.1'
        type: choice
        options:
        - shrp-12.1
        - shrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/mdhaaib200520/SHRP_Redmi-14C'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/pond'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'pond'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - vendorboot
        - recovery
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: false
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build SHRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      OUTPUT_DIR: ${{ github.workspace }}/android-recovery/out/target/product
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Display Inputs
      run: |
        echo "Manifest: ${{ inputs.MANIFEST }} @ ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ inputs.DEVICE_TREE }} @ ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ inputs.BUILD_TARGET }}image"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install \
          gperf gcc-multilib g++-multilib libc6-dev \
          x11proto-core-dev libx11-dev tree lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
          libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools \
          imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libstdc++-10-dev libgflags-dev python3 python3-pip python2

    - name: Python 2.7 symlinks (REQUIRED for SHRP)
      run: |
        sudo ln -sf /usr/bin/python2 /usr/bin/python2.7 || true
        sudo ln -sf /usr/bin/python2 /usr/bin/python || true
        python2.7 --version
        python --version

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "10G"

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install Git-Repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize Repo
      run: |
        mkdir -p android-recovery
        cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u ${{ inputs.MANIFEST }} -b ${{ inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: |
        cd android-recovery
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Verify SHRP vendor tree exists
      run: |
        cd android-recovery
        if [ ! -f vendor/shrp/config/common.mk ]; then
          echo "::error::vendor/shrp/config/common.mk NOT FOUND. SHRP manifest did not sync correctly."
          ls vendor/ 2>/dev/null || true
          exit 1
        fi
        echo "✔ SHRP vendor tree found at vendor/shrp/"

    - name: Clone Device Tree
      run: |
        cd android-recovery
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Debug - Inspect device tree
      run: |
        cd android-recovery
        echo "========= FULL TREE LISTING ========="
        find ${{ inputs.DEVICE_PATH }} -type f | sort
        echo ""
        echo "========= AndroidProducts.mk ========="
        cat ${{ inputs.DEVICE_PATH }}/AndroidProducts.mk 2>/dev/null || echo "MISSING"
        echo ""
        echo "========= prebuilt/ ========="
        ls -la ${{ inputs.DEVICE_PATH }}/prebuilt/ 2>/dev/null || echo "MISSING"
        echo ""
        echo "========= recovery/root/ ========="
        find ${{ inputs.DEVICE_PATH }}/recovery -type f 2>/dev/null || echo "MISSING"

    - name: Check Build Makefile
      run: |
        cd android-recovery
        DEVICE_DIR="${{ inputs.DEVICE_PATH }}"
        NAME="${{ inputs.DEVICE_NAME }}"

        if [ ! -d "$DEVICE_DIR" ]; then
          echo "::error::Device path '$DEVICE_DIR' does not exist."
          exit 1
        fi

        for prefix in shrp omni twrp; do
          if [ -f "$DEVICE_DIR/${prefix}_${NAME}.mk" ]; then
            echo "DEVICE_MAKEFILE=${prefix}_${NAME}" >> $GITHUB_ENV
            echo "✔ Found ${prefix}_${NAME}.mk"
            exit 0
          fi
        done

        echo "::error::No compatible makefile found in $DEVICE_DIR"
        ls -la "$DEVICE_DIR"
        find "$DEVICE_DIR" -maxdepth 2 -name "*.mk"
        exit 1

    - name: Building SHRP
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        make clean
        mka ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Collect artifacts
      if: always()
      id: artifacts
      run: |
        set +e
        mkdir -p "${{ env.OUTPUT_DIR }}"
        ARTIFACT_DIR="${{ github.workspace }}/artifacts"
        mkdir -p "$ARTIFACT_DIR"

        echo "=== Searching for build output ==="
        find "${{ env.OUTPUT_DIR }}" -type f \( -name "*.img" -o -name "*.zip" -o -name "ramdisk*" \) -print

        find "${{ env.OUTPUT_DIR }}" -type f \( -name "*.img" -o -name "*.zip" \) -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null
        find "${{ env.OUTPUT_DIR }}" -type f -name "ramdisk*" -exec cp -v {} "$ARTIFACT_DIR/" \; 2>/dev/null

        echo "=== Artifacts collected ==="
        ls -la "$ARTIFACT_DIR"

        COUNT=$(find "$ARTIFACT_DIR" -type f | wc -l)
        echo "ARTIFACT_COUNT=$COUNT" >> $GITHUB_ENV

        cd "$ARTIFACT_DIR"
        for f in *; do
          if [ -f "$f" ]; then
            md5sum "$f" > "$f.md5"
          fi
        done

        ls -la "$ARTIFACT_DIR" > "$ARTIFACT_DIR/filelist.txt"

        if [ "$COUNT" -eq 0 ]; then
          echo "::warning::No artifacts found. Build failed upstream."
          exit 0
        fi
        echo "✔ Collected $COUNT artifact(s)"

    - name: Upload workflow artifact
      if: always() && env.ARTIFACT_COUNT != '0'
      uses: actions/upload-artifact@v4
      with:
        name: shrp-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: ${{ github.workspace }}/artifacts/
        retention-days: 30

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

    - name: Generate release body
      if: always() && env.ARTIFACT_COUNT != '0'
      run: |
        cat > release_body.md << 'EOF'
        ## Unofficial SHRP Recovery

        **Device:** ${{ inputs.DEVICE_NAME }}
        **Build target:** ${{ inputs.BUILD_TARGET }}image
        **Build date:** ${{ env.BUILD_DATE }}

        ### Source
        - Manifest: `${{ inputs.MANIFEST }}` @ `${{ inputs.MANIFEST_BRANCH }}`
        - Device tree: `${{ inputs.DEVICE_TREE }}` @ `${{ inputs.DEVICE_TREE_BRANCH }}`
        - Commit: `${{ env.COMMIT_ID }}`

        ### Files & MD5
        EOF

        cd "${{ github.workspace }}/artifacts"
        for f in *; do
          if [ -f "$f" ] && [[ ! "$f" == *.md5 ]] && [[ "$f" != "filelist.txt" ]]; then
            MD5=$(md5sum "$f" | cut -d ' ' -f 1)
            SIZE=$(du -h "$f" | cut -f1)
            echo "- \`$f\` ($SIZE) — MD5: \`$MD5\`" >> ${{ github.workspace }}/release_body.md
          fi
        done

        echo "" >> ${{ github.workspace }}/release_body.md
        echo "### Flash" >> ${{ github.workspace }}/release_body.md
        echo '```' >> ${{ github.workspace }}/release_body.md
        echo "fastboot flash vendor_boot vendor_boot.img" >> ${{ github.workspace }}/release_body.md
        echo '```' >> ${{ github.workspace }}/release_body.md

        cat ${{ github.workspace }}/release_body.md

    - name: Create GitHub Release
      if: always() && env.ARTIFACT_COUNT != '0'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: shrp-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_TIME }}
        name: SHRP ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        body_path: ${{ github.workspace }}/release_body.md
        files: |
          ${{ github.workspace }}/artifacts/*
        draft: false
        prerelease: true
        generate_release_notes: false

    - name: Run LDCheck
      if: inputs.LDCHECK == true
      run: |
        set +e
        cd tools || exit 0
        mv -n libneeds ${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root/ 2>/dev/null
        mv -n ldcheck ${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root/ 2>/dev/null
        cd ${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root || exit 0
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
      continue-on-error: true
