
name: "SkyHawk [SHRP]"

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: "SHRP Manifest URL"
        required: true
        default: "https://github.com/SHRP/manifest.git"
      MANIFEST_BRANCH:
        description: "SHRP Manifest Branch"
        required: true
        default: "shrp-12.1"
        type: choice
        options:
          - shrp-12.1
          - shrp-9.0
      DEVICE_TREE:
        description: "Custom Recovery Tree"
        required: true
        default: "https://github.com/mdhaaib200520/SHRP_Redmi-14C"
      DEVICE_TREE_BRANCH:
        description: "Custom Recovery Tree Branch"
        required: true
        default: "main"
      DEVICE_PATH:
        description: "Specify your Device Path"
        required: true
        default: "device/xiaomi/pond"
      DEVICE_NAME:
        description: "Specify your Device Codename"
        required: true
        default: "pond"
      BUILD_TARGET:
        description: "Specify your Build Target"
        required: true
        default: "vendorboot"
        type: choice
        options:
          - vendorboot
          - recovery
      LDCHECK:
        description: "Use LDCHECK"
        required: false
        default: false
        type: boolean
      LDCHECKPATH:
        description: "Path of blobs to check"
        required: true
        default: "system/bin/qseecomd"

jobs:
  build:
    name: "Build SHRP by ${{ github.actor }}"
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    permissions:
      contents: write

    env:
      OUTPUT_DIR: ${{ github.workspace }}/android-recovery/out/target/product
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARTIFACT_COUNT: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display Inputs
        shell: bash
        run: |
          echo "Manifest: ${{ inputs.MANIFEST }}"
          echo "Manifest branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device tree: ${{ inputs.DEVICE_TREE }}"
          echo "Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device path: ${{ inputs.DEVICE_PATH }}"
          echo "Device name: ${{ inputs.DEVICE_NAME }}"
          echo "Build target: ${{ inputs.BUILD_TARGET }}image"

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Prepare Environment
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gperf gcc-multilib g++-multilib libc6-dev \
            x11proto-core-dev libx11-dev tree lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static \
            libstdc++-10-dev libgflags-dev python3 python3-pip \
            curl git git-lfs rsync unzip zip

          python3 --version
          git --version

          # Python 2 is optional at this stage. Do not replace the
          # runner's system Python or create conflicting /usr/bin links.
          if command -v python2 >/dev/null 2>&1; then
            python2 --version
          elif command -v python2.7 >/dev/null 2>&1; then
            python2.7 --version
          else
            echo "Python 2 is not installed on this runner."
          fi

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "10G"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Install Repo Tool
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize Repo
        shell: bash
        run: |
          set -e
          mkdir -p android-recovery
          cd android-recovery

          git config --global user.name "${{ github.actor }}"
          git config --global user.email \
            "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          repo init --depth=1 \
            -u "${{ inputs.MANIFEST }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Sync Sources
        shell: bash
        run: |
          set -e
          cd android-recovery
          repo sync -j"$(nproc --all)" \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Verify SHRP Vendor Tree
        shell: bash
        run: |
          set -e
          cd android-recovery

          if [ ! -f vendor/shrp/config/common.mk ]; then
            echo "::error::vendor/shrp/config/common.mk not found."
            echo "Check the manifest branch and vendor tree."
            ls -la vendor/ 2>/dev/null || true
            exit 1
          fi

          echo "SHRP vendor tree found."

      - name: Clone Device Tree
        shell: bash
        run: |
          set -euo pipefail
          cd android-recovery

          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"
          mkdir -p "$(dirname "$DEVICE_DIR")"

          if [ -e "$DEVICE_DIR" ]; then
            echo "::error::Device directory already exists: $DEVICE_DIR"
            exit 1
          fi

          git clone --depth=1 \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" \
            "$DEVICE_DIR"

          cd "$DEVICE_DIR"
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Inspect Device Tree
        shell: bash
        run: |
          set -e
          cd android-recovery
          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"

          echo "=== Device tree files ==="
          find "$DEVICE_DIR" -maxdepth 4 -type f | sort

          echo "=== AndroidProducts.mk ==="
          cat "$DEVICE_DIR/AndroidProducts.mk" 2>/dev/null || true

          echo "=== Product makefiles ==="
          find "$DEVICE_DIR" -maxdepth 2 -name "*.mk" -print

      - name: Check Device Makefile
        shell: bash
        run: |
          set -euo pipefail
          cd android-recovery

          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"
          DEVICE="${{ inputs.DEVICE_NAME }}"

          if [ ! -d "$DEVICE_DIR" ]; then
            echo "::error::Device directory not found: $DEVICE_DIR"
            exit 1
          fi

          DEVICE_MAKEFILE=""

          for PREFIX in shrp omni twrp; do
            if [ -f "$DEVICE_DIR/${PREFIX}_${DEVICE}.mk" ]; then
              DEVICE_MAKEFILE="${PREFIX}_${DEVICE}"
              break
            fi
          done

          if [ -z "$DEVICE_MAKEFILE" ]; then
            echo "::error::No shrp_${DEVICE}.mk, omni_${DEVICE}.mk, or twrp_${DEVICE}.mk found."
            find "$DEVICE_DIR" -maxdepth 3 -name "*.mk" -print
            exit 1
          fi

          echo "DEVICE_MAKEFILE=$DEVICE_MAKEFILE" >> "$GITHUB_ENV"
          echo "Using makefile: $DEVICE_MAKEFILE"

      - name: Build SHRP
        shell: bash
        run: |
          set -euo pipefail
          cd android-recovery

          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true

          lunch "${DEVICE_MAKEFILE}-eng"
          make clean

          mka "${{ inputs.BUILD_TARGET }}image" \
            -j"$(nproc --all)"

      - name: Collect Artifacts
        if: always()
        shell: bash
        run: |
          set +e

          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts"
          mkdir -p "$ARTIFACT_DIR"

          if [ -d "${{ env.OUTPUT_DIR }}" ]; then
            find "${{ env.OUTPUT_DIR }}" -type f \
              \( -name "*.img" -o -name "*.zip" -o -name "ramdisk*" \) \
              -print

            find "${{ env.OUTPUT_DIR }}" -type f \
              \( -name "*.img" -o -name "*.zip" \) \
              -exec cp -f {} "$ARTIFACT_DIR/" \;

            find "${{ env.OUTPUT_DIR }}" -type f -name "ramdisk*" \
              -exec cp -f {} "$ARTIFACT_DIR/" \;
          fi

          COUNT=$(find "$ARTIFACT_DIR" -maxdepth 1 -type f \
            ! -name "*.md5" \
            ! -name "filelist.txt" | wc -l)

          echo "ARTIFACT_COUNT=$COUNT" >> "$GITHUB_ENV"

          for FILE in "$ARTIFACT_DIR"/*; do
            [ -f "$FILE" ] || continue
            case "$FILE" in
              *.md5|*/filelist.txt) continue ;;
            esac
            md5sum "$FILE" > "$FILE.md5"
          done

          ls -la "$ARTIFACT_DIR" > "$ARTIFACT_DIR/filelist.txt"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No build artifacts found."
          else
            echo "Collected $COUNT artifact(s)."
          fi

          exit 0

      - name: Upload Workflow Artifacts
        if: always() && env.ARTIFACT_COUNT != '0'
        uses: actions/upload-artifact@v4
        with:
          name: shrp-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Set Build Date
        if: always()
        shell: bash
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Generate Release Body
        if: always() && env.ARTIFACT_COUNT != '0'
        shell: bash
        run: |
          {
            echo "## Unofficial SHRP Recovery"
            echo
            echo "**Device:** ${{ inputs.DEVICE_NAME }}"
            echo "**Build target:** ${{ inputs.BUILD_TARGET }}image"
            echo "**Build date:** ${BUILD_DATE}"
            echo
            echo "### Source"
            echo "- Manifest: ${{ inputs.MANIFEST }}"
            echo "- Manifest branch: ${{ inputs.MANIFEST_BRANCH }}"
            echo "- Device tree: ${{ inputs.DEVICE_TREE }}"
            echo "- Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
            echo "- Commit: ${COMMIT_ID:-unknown}"
            echo
            echo "### Files and MD5"
          } > "${GITHUB_WORKSPACE}/release_body.md"

          for FILE in "${GITHUB_WORKSPACE}"/artifacts/*; do
            [ -f "$FILE" ] || continue

            case "$FILE" in
              *.md5|*/filelist.txt) continue ;;
            esac

            NAME="$(basename "$FILE")"
            HASH="$(md5sum "$FILE" | cut -d ' ' -f 1)"
            SIZE="$(du -h "$FILE" | cut -f1)"

            echo "- $NAME ($SIZE) — MD5: $HASH" \
              >> "${GITHUB_WORKSPACE}/release_body.md"
          done

          {
            echo
            echo "### Flash command"
            echo '```bash'

            if [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then
              echo "fastboot flash vendor_boot vendor_boot.img"
            else
              echo "fastboot flash recovery recovery.img"
            fi

            echo '```'
          } >> "${GITHUB_WORKSPACE}/release_body.md"

          cat "${GITHUB_WORKSPACE}/release_body.md"

      - name: Create GitHub Release
        if: always() && env.ARTIFACT_COUNT != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shrp-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_TIME }}
          name: SHRP ${{ inputs.DEVICE_NAME }} - ${{ env.BUILD_DATE }}
          body_path: ${{ github.workspace }}/release_body.md
          files: |
            ${{ github.workspace }}/artifacts/*
          draft: false
          prerelease: true
          generate_release_notes: false

      - name: Run LDCheck
        if: inputs.LDCHECK
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd android-recovery

          DEVICE_OUT="${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}"
          mkdir -p "$DEVICE_OUT/recovery/root"

          if [ -f tools/libneeds ]; then
            cp -f tools/libneeds "$DEVICE_OUT/recovery/root/"
          fi

          if [ -f tools/ldcheck ]; then
            cp -f tools/ldcheck "$DEVICE_OUT/recovery/root/"
          fi

          cd "$DEVICE_OUT/recovery/root" || exit 0

          if [ -f ldcheck ]; then
            python3 ldcheck \
              -p system/lib64:vendor/lib64:system/lib:vendor/lib \
              -d "${{ inputs.LDCHECKPATH }}"
          else
            echo "::warning::ldcheck tool not found; skipping."
          fi
