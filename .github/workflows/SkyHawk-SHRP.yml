
name: SkyHawk Recovery Project (SHRP) Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: "SHRP manifest URL"
        required: true
        default: "https://github.com/SHRP/manifest.git"
        type: string

      MANIFEST_BRANCH:
        description: "SHRP manifest branch"
        required: true
        default: "shrp-12.1"
        type: string

      DEVICE_TREE:
        description: "Xiaomi pond device tree URL"
        required: true
        default: "https://github.com/mdhaaib200520/SHRP_Redmi-14C"
        type: string

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "main"
        type: string

      DEVICE_PATH:
        description: "Device tree directory"
        required: true
        default: "device/xiaomi/pond"
        type: string

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "pond"
        type: string

      BUILD_TARGET:
        description: "Image to build"
        required: true
        type: choice
        options:
          - recovery
          - vendorboot
        default: recovery

      LDCHECK:
        description: "Run optional linker check"
        required: true
        type: boolean
        default: false

      LDCHECK_FILE:
        description: "Binary to inspect"
        required: true
        default: "system/bin/recovery"
        type: string

permissions:
  contents: write

concurrency:
  group: shrp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SHRP for pond
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      OUTPUT_DIR: ${{ github.workspace }}/android-recovery/out/target/product
      ARTIFACT_COUNT: "0"

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        shell: bash
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick lib32ncurses-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 \
            libxml2-utils lzop openjdk-11-jdk \
            python-is-python3 rsync schedtool squashfs-tools \
            unzip xz-utils zip zlib1g-dev

          python --version
          python3 --version
          java -version

          if command -v python2 >/dev/null 2>&1; then
            python2 --version
          else
            echo "::warning::Python 2 is unavailable. A legacy build may require additional setup."
          fi

      - name: Configure Java
        shell: bash
        run: |
          set -e
          JAVA_PATH="$(readlink -f "$(command -v javac)")"
          JAVA_HOME_PATH="$(dirname "$(dirname "$JAVA_PATH")")"
          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_PATH/bin" >> "$GITHUB_PATH"

      - name: Configure Swap
        shell: bash
        run: |
          set -e
          if ! swapon --show | grep -q '/swapfile'; then
            sudo fallocate -l 12G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Configure Git and Repo
        shell: bash
        run: |
          set -e
          git config --global user.name "${{ github.actor }}"
          git config --global user.email \
            "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize Repo
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p android-recovery
          cd android-recovery

          repo init --depth=1 \
            -u "${{ inputs.MANIFEST }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Sync Sources
        shell: bash
        run: |
          set -eo pipefail
          cd android-recovery

          repo sync -c -j"$(nproc --all)" \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Verify SHRP Vendor Tree
        shell: bash
        run: |
          set -eo pipefail
          cd android-recovery

          if [ ! -d vendor/shrp ]; then
            echo "::error::vendor/shrp is missing."
            echo "Check whether the selected manifest includes the SHRP vendor repository."
            find vendor -maxdepth 3 -type d -print 2>/dev/null || true
            exit 1
          fi

          echo "=== SHRP configuration files ==="
          find vendor/shrp -type f \
            \( -name "common.mk" -o -name "*shrp*.mk" \) \
            -print | sort

          if [ ! -f vendor/shrp/config/common.mk ]; then
            echo "::warning::vendor/shrp/config/common.mk is absent."
            echo "The build will continue to product configuration."
            echo "If SHRP requires this file, the manifest or vendor tree must be corrected."
          fi

      - name: Clone Device Tree
        shell: bash
        run: |
          set -eo pipefail
          cd android-recovery

          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"
          mkdir -p "$(dirname "$DEVICE_DIR")"

          if [ -e "$DEVICE_DIR" ]; then
            echo "::error::Device path already exists: $DEVICE_DIR"
            echo "Remove the duplicate manifest entry or choose the correct device path."
            exit 1
          fi

          git clone --depth=1 \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" \
            "$DEVICE_DIR"

          cd "$DEVICE_DIR"
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Inspect Device Tree
        shell: bash
        run: |
          set -eo pipefail
          cd android-recovery
          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"

          echo "=== Device tree ==="
          find "$DEVICE_DIR" -maxdepth 4 -type f | sort

          echo "=== AndroidProducts.mk ==="
          if [ -f "$DEVICE_DIR/AndroidProducts.mk" ]; then
            cat "$DEVICE_DIR/AndroidProducts.mk"
          else
            echo "::error::AndroidProducts.mk is missing."
            exit 1
          fi

          echo "=== Device makefiles ==="
          find "$DEVICE_DIR" -maxdepth 4 -type f -name "*.mk" -print | sort

      - name: Check Device Makefile
        shell: bash
        run: |
          set -eo pipefail
          cd android-recovery

          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"
          DEVICE="${{ inputs.DEVICE_NAME }}"
          DEVICE_MAKEFILE=""

          for PREFIX in shrp omni twrp; do
            if [ -f "$DEVICE_DIR/${PREFIX}_${DEVICE}.mk" ]; then
              DEVICE_MAKEFILE="${PREFIX}_${DEVICE}"
              break
            fi
          done

          if [ -z "$DEVICE_MAKEFILE" ]; then
            echo "::error::No supported device makefile found."
            echo "Expected shrp_${DEVICE}.mk, omni_${DEVICE}.mk, or twrp_${DEVICE}.mk."
            find "$DEVICE_DIR" -maxdepth 4 -type f -name "*.mk" -print | sort
            exit 1
          fi

          echo "DEVICE_MAKEFILE=$DEVICE_MAKEFILE" >> "$GITHUB_ENV"
          echo "Using $DEVICE_MAKEFILE"

      - name: Configure CCache
        shell: bash
        run: |
          set -e
          ccache -M 5G
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache -s

      - name: Build SHRP
        shell: bash
        run: |
          set -eo pipefail
          cd "${GITHUB_WORKSPACE}/android-recovery"

          # Do not enable `set -u` when sourcing older Android envsetup scripts.
          export TOP="${PWD}"
          export ALLOW_MISSING_DEPENDENCIES=true

          echo "=== Source root ==="
          echo "$TOP"

          if [ ! -f "$TOP/build/envsetup.sh" ]; then
            echo "::error::build/envsetup.sh not found."
            exit 1
          fi

          if [ ! -d "$TOP/${{ inputs.DEVICE_PATH }}" ]; then
            echo "::error::Device tree directory is missing."
            exit 1
          fi

          echo "=== Loading Android build environment ==="
          source "$TOP/build/envsetup.sh"

          echo "=== Device setup script ==="
          if [ -f "$TOP/${{ inputs.DEVICE_PATH }}/vendorsetup.sh" ]; then
            echo "Found device vendorsetup.sh"
          else
            echo "::warning::Device vendorsetup.sh is missing."
            echo "Checking product registration files."
            if [ -f "$TOP/${{ inputs.DEVICE_PATH }}/AndroidProducts.mk" ]; then
              cat "$TOP/${{ inputs.DEVICE_PATH }}/AndroidProducts.mk"
            fi
          fi

          echo "=== Selecting product ==="
          lunch "${DEVICE_MAKEFILE}-eng"

          case "${{ inputs.BUILD_TARGET }}" in
            recovery)
              BUILD_GOAL="recoveryimage"
              ;;
            vendorboot)
              BUILD_GOAL="vendorbootimage"
              ;;
            *)
              echo "::error::Unsupported build target."
              exit 1
              ;;
          esac

          echo "=== Building $BUILD_GOAL ==="
          mka "$BUILD_GOAL" -j"$(nproc --all)"

      - name: Collect Artifacts
        if: always()
        shell: bash
        run: |
          set -eo pipefail

          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts"
          DEVICE_OUTPUT="${OUTPUT_DIR}/${{ inputs.DEVICE_NAME }}"
          mkdir -p "$ARTIFACT_DIR"

          if [ -d "$DEVICE_OUTPUT" ]; then
            find "$DEVICE_OUTPUT" -type f \
              \( -name "*.img" -o -name "*.zip" -o -name "ramdisk*" \) \
              -exec cp -f -t "$ARTIFACT_DIR" {} +
          else
            echo "::warning::Output directory not found: $DEVICE_OUTPUT"
          fi

          COUNT="$(find "$ARTIFACT_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          echo "ARTIFACT_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "Collected $COUNT artifact(s)."
          ls -lh "$ARTIFACT_DIR"

      - name: Upload Workflow Artifacts
        if: always() && env.ARTIFACT_COUNT != '0'
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-${{ inputs.DEVICE_NAME }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success() && env.ARTIFACT_COUNT != '0'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: SHRP-${{ inputs.DEVICE_NAME }}-${{ github.run_number }}
          name: SHRP ${{ inputs.DEVICE_NAME }} build ${{ github.run_number }}
          body: |
            Automated SHRP recovery build.
            Device: ${{ inputs.DEVICE_NAME }}
            Target: ${{ inputs.BUILD_TARGET }}
            Manifest branch: ${{ inputs.MANIFEST_BRANCH }}
            Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            Device tree commit: ${{ env.SHORT_COMMIT }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: artifacts/*

      - name: Optional Linker Dependency Check
        if: success() && inputs.LDCHECK
        shell: bash
        run: |
          set -eo pipefail
          DEVICE_OUTPUT="${OUTPUT_DIR}/${{ inputs.DEVICE_NAME }}"
          CHECK_FILE="${{ inputs.LDCHECK_FILE }}"

          if [ ! -f "$DEVICE_OUTPUT/$CHECK_FILE" ]; then
            echo "::warning::File not found: $DEVICE_OUTPUT/$CHECK_FILE"
            exit 0
          fi

          if command -v readelf >/dev/null 2>&1; then
            readelf -d "$DEVICE_OUTPUT/$CHECK_FILE" || true
          else
            echo "::warning::readelf is not installed."
          fi
          
