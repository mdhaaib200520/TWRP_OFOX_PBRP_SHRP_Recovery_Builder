
name: SHRP Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "SHRP manifest URL"
        required: true
        default: "https://github.com/SHRP/manifest.git"
        type: string

      MANIFEST_BRANCH:
        description: "Manifest branch compatible with your device tree"
        required: true
        default: "shrp-12.1"
        type: string

      DEVICE_TREE_URL:
        description: "Xiaomi pond device tree"
        required: true
        default: "https://github.com/mdhaaib200520/SHRP_Redmi-14C"
        type: string

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "main"
        type: string

      DEVICE_PATH:
        description: "Device tree path"
        required: true
        default: "device/xiaomi/pond"
        type: string

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "pond"
        type: string

      BUILD_TARGET:
        description: "Recovery image target"
        required: true
        type: choice
        options:
          - recovery
          - vendorboot
        default: recovery

permissions:
  contents: write

concurrency:
  group: shrp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SHRP for pond
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        shell: bash
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick lib32ncurses-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 \
            libxml2-utils lzop openjdk-11-jdk rsync \
            schedtool squashfs-tools unzip xz-utils zip \
            zlib1g-dev libffi-dev libsqlite3-dev libbz2-dev \
            libreadline-dev libncursesw5-dev libgdbm-dev \
            liblzma-dev tk-dev uuid-dev wget

          java -version
          python3 --version

      - name: Install Python 2.7
        shell: bash
        run: |
          set -eo pipefail

          if ! command -v python2.7 >/dev/null 2>&1; then
            cd /tmp
            curl -fL --retry 3 \
              https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz \
              -o Python-2.7.18.tgz

            tar -xzf Python-2.7.18.tgz
            cd Python-2.7.18

            ./configure \
              --prefix=/usr/local \
              --enable-shared \
              --with-ensurepip=no

            make -j2
            sudo make altinstall
          fi

          echo "/usr/local/bin" >> "$GITHUB_PATH"
          sudo ldconfig
          python2.7 --version

      - name: Configure Java
        shell: bash
        run: |
          set -e
          JAVA_PATH="$(readlink -f "$(command -v javac)")"
          JAVA_HOME_PATH="$(dirname "$(dirname "$JAVA_PATH")")"
          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_PATH/bin" >> "$GITHUB_PATH"

      - name: Configure Swap
        shell: bash
        run: |
          set -e
          if ! swapon --show | grep -q '/swapfile'; then
            sudo fallocate -l 12G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Install Repo Tool
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize SHRP Sources
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p android-recovery
          cd android-recovery

          repo init --depth=1 \
            -u "${{ inputs.MANIFEST_URL }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Sync SHRP Sources
        shell: bash
        run: |
          set -eo pipefail
          cd android-recovery

          repo sync -c -j"$(nproc --all)" \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Check Device Tree Path
        shell: bash
        run: |
          set -eo pipefail
          cd android-recovery

          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"

          if [ -e "$DEVICE_DIR" ]; then
            echo "::error::Device path already exists: $DEVICE_DIR"
            echo "Check whether the manifest already includes this tree."
            exit 1
          fi

          mkdir -p "$(dirname "$DEVICE_DIR")"

          git clone --depth=1 \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE_URL }}" \
            "$DEVICE_DIR"

          echo "DEVICE_COMMIT=$(git -C "$DEVICE_DIR" rev-parse HEAD)" \
            >> "$GITHUB_ENV"

          echo "DEVICE_SHORT_COMMIT=$(git -C "$DEVICE_DIR" rev-parse --short HEAD)" \
            >> "$GITHUB_ENV"

      - name: Validate SHRP Product and Vendor Files
        shell: bash
        run: |
          set -eo pipefail
          cd android-recovery

          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"
          DEVICE="${{ inputs.DEVICE_NAME }}"

          test -f "$DEVICE_DIR/AndroidProducts.mk" || {
            echo "::error::AndroidProducts.mk is missing."
            exit 1
          }

          PRODUCT_MK=""
          for PREFIX in shrp omni twrp; do
            if [ -f "$DEVICE_DIR/${PREFIX}_${DEVICE}.mk" ]; then
              PRODUCT_MK="${PREFIX}_${DEVICE}"
              break
            fi
          done

          if [ -z "$PRODUCT_MK" ]; then
            echo "::error::No product makefile found for $DEVICE."
            find "$DEVICE_DIR" -maxdepth 3 -name "*.mk" -print
            exit 1
          fi

          echo "DEVICE_MAKEFILE=$PRODUCT_MK" >> "$GITHUB_ENV"
          echo "Using product: $PRODUCT_MK"

          echo "=== Product registration ==="
          cat "$DEVICE_DIR/AndroidProducts.mk"

          echo "=== Vendor directories ==="
          ls -la vendor || true
          ls -la vendor/shrp || true

          echo "=== Search for SHRP common.mk ==="
          find vendor -type f -path "*/config/common.mk" \
            -print 2>/dev/null || true

          if grep -nE 'vendor/shrp/config/common\.mk' \
              "$DEVICE_DIR/device.mk" 2>/dev/null; then
            if [ ! -f vendor/shrp/config/common.mk ]; then
              echo "::error::The device tree requires vendor/shrp/config/common.mk, but it is missing."
              echo "Fix the SHRP vendor source or the device tree include before building."
              exit 1
            fi
          fi

      - name: Configure CCache
        shell: bash
        run: |
          set -e
          ccache -M 5G
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache -s

      - name: Build SHRP
        shell: bash
        run: |
          set -eo pipefail
          cd "${GITHUB_WORKSPACE}/android-recovery"

          export TOP="$PWD"
          export ALLOW_MISSING_DEPENDENCIES=true
          export PATH="/usr/local/bin:$PATH"

          test -f "$TOP/build/envsetup.sh" || {
            echo "::error::build/envsetup.sh is missing."
            exit 1
          }

          echo "=== Loading Android build environment ==="
          source "$TOP/build/envsetup.sh"

          echo "=== Selecting product ==="
          lunch "${DEVICE_MAKEFILE}-eng"

          case "${{ inputs.BUILD_TARGET }}" in
            recovery)
              BUILD_GOAL="recoveryimage"
              ;;
            vendorboot)
              BUILD_GOAL="vendorbootimage"
              ;;
            *)
              echo "::error::Unsupported build target."
              exit 1
              ;;
          esac

          echo "=== Building $BUILD_GOAL ==="
          mka "$BUILD_GOAL" -j"$(nproc --all)"

      - name: Collect Artifacts
        if: always()
        shell: bash
        run: |
          set -eo pipefail

          DEVICE_OUTPUT="${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}"
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifacts"

          mkdir -p "$ARTIFACT_DIR"

          if [ -d "$DEVICE_OUTPUT" ]; then
            find "$DEVICE_OUTPUT" -maxdepth 2 -type f \
              \( -name "*.img" -o -name "*.zip" \) \
              -exec cp -f -t "$ARTIFACT_DIR" {} +
          else
            echo "::warning::Build output directory not found: $DEVICE_OUTPUT"
          fi

          echo "=== Collected artifacts ==="
          ls -lh "$ARTIFACT_DIR"

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-${{ inputs.DEVICE_NAME }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: SHRP-${{ inputs.DEVICE_NAME }}-${{ github.run_number }}
          name: SHRP ${{ inputs.DEVICE_NAME }} build ${{ github.run_number }}
          body: |
            Automated SHRP build.
            Device: ${{ inputs.DEVICE_NAME }}
            Target: ${{ inputs.BUILD_TARGET }}
            Manifest branch: ${{ inputs.MANIFEST_BRANCH }}
            Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            Device tree commit: ${{ env.DEVICE_SHORT_COMMIT }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: artifacts/*
          
