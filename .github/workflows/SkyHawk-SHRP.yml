
name: SHRP Recovery Builder - Redmi 14C (pond)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "SHRP manifest repository"
        required: true
        default: "https://github.com/SHRP/manifest.git"
        type: string

      MANIFEST_BRANCH:
        description: "SHRP manifest branch"
        required: true
        default: "shrp-12.1"
        type: string

      DEVICE_TREE_URL:
        description: "Redmi 14C device tree"
        required: true
        default: "https://github.com/mdhaaib200520/SHRP_Redmi-14C"
        type: string

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "main"
        type: string

      BUILD_TARGET:
        description: "Recovery image target"
        required: true
        type: choice
        options:
          - recoveryimage
          - vendorbootimage
        default: recoveryimage

      RELEASE_TAG:
        description: "Optional GitHub release tag (leave blank to skip release)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: shrp-pond-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SHRP for pond
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: UTC
      DEVICE_PATH: device/xiaomi/pond
      DEVICE_NAME: pond
      PRODUCT_NAME: shrp_pond
      PYTHON_VERSION: "2.7.18"
      USE_CCACHE: "1"
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      RELEASE_TAG: ${{ inputs.RELEASE_TAG }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop make pngcrush rsync schedtool \
            squashfs-tools unzip zip zlib1g-dev \
            python3 python3-pip python-is-python3 \
            openjdk-11-jdk jq

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "11"

      - name: Configure swap
        shell: bash
        run: |
          set -euxo pipefail
          if ! swapon --show | grep -q '/swapfile'; then
            sudo fallocate -l 12G /swapfile || \
              sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: Install Python 2.7 for legacy build scripts
        shell: bash
        run: |
          set -euxo pipefail
          if command -v python2.7 >/dev/null 2>&1; then
            python2.7 --version
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/python27"
          cd "$RUNNER_TEMP/python27"

          curl -fsSLO \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xzf Python-2.7.18.tgz
          cd Python-2.7.18

          ./configure \
            --prefix=/usr/local \
            --enable-unicode=ucs4 \
            --with-ensurepip=no

          make -j2
          sudo make altinstall

          python2.7 --version

      - name: Initialize SHRP source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android-recovery
          cd android-recovery

          repo init \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH" \
            --depth=1

      - name: Sync SHRP source
        shell: bash
        run: |
          set -euxo pipefail
          cd android-recovery

          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2

      - name: Clone Redmi 14C device tree
        shell: bash
        run: |
          set -euxo pipefail
          cd android-recovery

          if [ -e "$DEVICE_PATH" ]; then
            echo "Removing existing device tree at $DEVICE_PATH"
            rm -rf "$DEVICE_PATH"
          fi

          mkdir -p "$(dirname "$DEVICE_PATH")"

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_PATH"

          echo "=== Device tree files ==="
          ls -la "$DEVICE_PATH"

          test -f "$DEVICE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_PATH/device.mk"

          if [ ! -f "$DEVICE_PATH/shrp_pond.mk" ]; then
            echo "::error::Missing $DEVICE_PATH/shrp_pond.mk"
            echo "The device tree must provide the SHRP product makefile."
            exit 1
          fi

      - name: Diagnose SHRP vendor configuration
        shell: bash
        run: |
          set -u
          cd android-recovery

          echo "========== vendor/shrp directory =========="
          ls -la vendor/shrp 2>&1 || true

          echo
          echo "========== vendor/shrp Git information =========="
          if git -C vendor/shrp rev-parse --is-inside-work-tree \
              >/dev/null 2>&1; then
            git -C vendor/shrp remote -v || true
            git -C vendor/shrp branch -a || true
            git -C vendor/shrp log -1 --oneline || true
          else
            echo "vendor/shrp is not a Git repository"
          fi

          echo
          echo "========== Search vendor tree for common.mk =========="
          find vendor -path '*/config/common.mk' -type f -print \
            2>/dev/null || true

          echo
          echo "========== Manifest project declarations =========="
          grep -RniE 'android_vendor_shrp|vendor/shrp' \
            .repo/manifests .repo/local_manifests 2>/dev/null || true

          echo
          echo "========== Project list references =========="
          grep -nE 'vendor/shrp|android_vendor_shrp' \
            .repo/project.list 2>/dev/null || true

          if [ -f vendor/shrp/config/common.mk ]; then
            echo "SHRP vendor common.mk exists."
          else
            echo "::error::vendor/shrp/config/common.mk is missing."
            echo "The synced SHRP vendor project or manifest is incompatible."
            echo "Inspect the Git remote, branch, and manifest output above."
            exit 1
          fi

      - name: Validate SHRP product configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd android-recovery

          echo "========== Product makefile =========="
          sed -n '1,220p' "$DEVICE_PATH/shrp_pond.mk"

          echo
          echo "========== AndroidProducts.mk =========="
          cat "$DEVICE_PATH/AndroidProducts.mk"

          echo
          echo "========== SHRP common configuration =========="
          test -f vendor/shrp/config/common.mk

          echo
          echo "========== Required product references =========="
          grep -RniE \
            'vendor/shrp/config/common.mk|shrp_pond|PRODUCT_NAME' \
            "$DEVICE_PATH" \
            --include='*.mk' \
            --include='AndroidProducts.mk' || true

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -M 8G
          ccache -o compression=true
          ccache -s

      - name: Build SHRP recovery
        shell: bash
        run: |
          set -euxo pipefail
          cd android-recovery

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"

          source build/envsetup.sh

          lunch "${PRODUCT_NAME}-eng"

          if [ "$BUILD_TARGET" = "vendorbootimage" ]; then
            mka vendorbootimage
          else
            mka recoveryimage
          fi

      - name: Collect build artifacts
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p output

          cd android-recovery

          echo "========== Search for recovery images =========="
          find out/target/product/pond \
            -maxdepth 3 \
            -type f \
            \( -name 'recovery.img' \
            -o -name 'vendor_boot.img' \
            -o -name 'boot.img' \) \
            -print 2>/dev/null || true

          for image in recovery.img vendor_boot.img boot.img; do
            find out/target/product/pond \
              -maxdepth 3 \
              -type f \
              -name "$image" \
              -exec cp -f {} "$GITHUB_WORKSPACE/output/" \; \
              2>/dev/null || true
          done

          cd "$GITHUB_WORKSPACE"

          echo "========== Collected artifacts =========="
          ls -lh output || true

      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-pond-recovery
          path: output/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub release
        if: success() && inputs.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.RELEASE_TAG }}
          name: SHRP Recovery - Redmi 14C (pond)
          body: |
            SHRP recovery build for Xiaomi Redmi 14C / POCO C75.
            Device codename: pond
            Manifest branch: ${{ inputs.MANIFEST_BRANCH }}
            Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }}
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
