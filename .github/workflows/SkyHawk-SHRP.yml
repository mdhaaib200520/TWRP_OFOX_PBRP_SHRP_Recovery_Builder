
name: SHRP Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: SHRP manifest URL
        required: true
        default: https://github.com/SHRP-Reborn/manifest.git
        type: string

      MANIFEST_BRANCH:
        description: SHRP manifest branch
        required: true
        default: shrp-12.1
        type: string

      DEVICE_TREE_URL:
        description: Xiaomi pond device tree
        required: true
        default: https://github.com/mdhaaib200520/SHRP_Redmi-14C
        type: string

      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: main
        type: string

      DEVICE_PATH:
        description: Device tree path
        required: true
        default: device/xiaomi/pond
        type: string

      DEVICE_NAME:
        description: Device codename
        required: true
        default: pond
        type: string

      BUILD_TARGET:
        description: Recovery image target
        required: true
        type: choice
        options:
          - recovery
          - vendorboot
        default: recovery

permissions:
  contents: write

concurrency:
  group: shrp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SHRP for pond
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick lib32ncurses-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 \
            libxml2-utils lzop openjdk-11-jdk rsync \
            schedtool squashfs-tools unzip xz-utils zip \
            zlib1g-dev libffi-dev libsqlite3-dev libbz2-dev \
            libreadline-dev libncursesw5-dev libgdbm-dev \
            liblzma-dev tk-dev uuid-dev wget python3 \
            libncurses5-dev libncurses5

          java -version
          python3 --version

      - name: Install Python 2.7
        shell: bash
        run: |
          set -e

          if ! command -v python2.7 >/dev/null 2>&1; then
            cd /tmp
            curl -fL --retry 3 \
              https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz \
              -o Python-2.7.18.tgz
            tar -xzf Python-2.7.18.tgz
            cd Python-2.7.18

            ./configure \
              --prefix=/usr/local \
              --enable-shared \
              --with-ensurepip=no

            make -j2
            sudo make altinstall
          fi

          echo "/usr/local/bin" >> "$GITHUB_PATH"
          sudo ldconfig
          python2.7 --version

      - name: Configure Java
        shell: bash
        run: |
          set -e
          JAVA_PATH="$(readlink -f "$(command -v javac)")"
          JAVA_HOME_PATH="$(dirname "$(dirname "$JAVA_PATH")")"
          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_PATH/bin" >> "$GITHUB_PATH"

      - name: Configure Swap
        shell: bash
        run: |
          set -e
          if ! swapon --show | grep -q '/swapfile'; then
            sudo fallocate -l 12G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Install Repo Tool
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize SHRP Sources
        shell: bash
        run: |
          set -e
          mkdir -p android-recovery
          cd android-recovery

          repo init --depth=1 \
            -u "${{ inputs.MANIFEST_URL }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Sync SHRP Sources
        shell: bash
        run: |
          set -e
          cd android-recovery
          repo sync -c -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Ensure SHRP Vendor Configuration
        shell: bash
        run: |
          set -e
          cd android-recovery

          if [ ! -f vendor/shrp/config/common.mk ]; then
            echo "SHRP common.mk missing; checking vendor repository."

            if [ -e vendor/shrp ]; then
              echo "::error::vendor/shrp exists but config/common.mk is missing."
              echo "Inspect the existing repository and branch before replacing it."
              exit 1
            fi

            git clone \
              https://github.com/SHRP/android_vendor_shrp.git \
              vendor/shrp
          fi

          if [ ! -f vendor/shrp/config/common.mk ]; then
            echo "::error::Vendor repository does not provide config/common.mk."
            echo "A compatible SHRP 12.1 vendor branch is required."
            git -C vendor/shrp branch -a || true
            exit 1
          fi

          echo "SHRP vendor common.mk found."

      - name: Fetch Pond Device Tree
        shell: bash
        run: |
          set -e
          cd android-recovery

          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"

          if [ -e "$DEVICE_DIR" ]; then
            echo "::error::Device path already exists: $DEVICE_DIR"
            exit 1
          fi

          mkdir -p "$(dirname "$DEVICE_DIR")"

          git clone --depth=1 \
            --branch "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE_URL }}" \
            "$DEVICE_DIR"

          echo "DEVICE_COMMIT=$(git -C "$DEVICE_DIR" rev-parse HEAD)" \
            >> "$GITHUB_ENV"

          echo "DEVICE_SHORT_COMMIT=$(git -C "$DEVICE_DIR" rev-parse --short HEAD)" \
            >> "$GITHUB_ENV"

      - name: Validate SHRP Product
        shell: bash
        run: |
          set -e
          cd android-recovery

          DEVICE_DIR="${{ inputs.DEVICE_PATH }}"

          for FILE in AndroidProducts.mk BoardConfig.mk device.mk shrp_pond.mk; do
            if [ ! -f "$DEVICE_DIR/$FILE" ]; then
              echo "::error::Missing $DEVICE_DIR/$FILE"
              exit 1
            fi
          done

          if [ ! -f vendor/shrp/config/common.mk ]; then
            echo "::error::SHRP common.mk is missing."
            exit 1
          fi

          echo "=== AndroidProducts.mk ==="
          cat "$DEVICE_DIR/AndroidProducts.mk"

          echo "=== Product makefile ==="
          grep -nE 'PRODUCT_NAME|PRODUCT_DEVICE|inherit-product' \
            "$DEVICE_DIR/shrp_pond.mk" || true

      - name: Configure CCache
        shell: bash
        run: |
          set -e
          ccache -M 5G
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache -s

      - name: Build SHRP
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android-recovery"

          export TOP="$PWD"
          export ALLOW_MISSING_DEPENDENCIES=true
          export PATH="/usr/local/bin:$PATH"

          test -f build/envsetup.sh || {
            echo "::error::build/envsetup.sh is missing."
            exit 1
          }

          source build/envsetup.sh

          echo "=== Select SHRP product ==="
          lunch shrp_pond-eng

          case "${{ inputs.BUILD_TARGET }}" in
            recovery)
              BUILD_GOAL=recoveryimage
              ;;
            vendorboot)
              BUILD_GOAL=vendorbootimage
              ;;
            *)
              echo "::error::Unsupported build target."
              exit 1
              ;;
          esac

          echo "=== Building $BUILD_GOAL ==="
          mka "$BUILD_GOAL" -j2

      - name: Collect Artifacts
        if: always()
        shell: bash
        run: |
          set -e
          OUTPUT="$GITHUB_WORKSPACE/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}"
          mkdir -p artifacts

          if [ -d "$OUTPUT" ]; then
            for FILE in recovery.img vendor_boot.img; do
              if [ -f "$OUTPUT/$FILE" ]; then
                cp -f "$OUTPUT/$FILE" "artifacts/$FILE"
              fi
            done

            find "$OUTPUT" -maxdepth 1 -type f \
              -name '*.zip' -exec cp -f {} artifacts/ \;
          else
            echo "::warning::Output directory not found: $OUTPUT"
          fi

          ls -lh artifacts || true

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-pond-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: SHRP-pond-${{ github.run_number }}
          name: SHRP pond build ${{ github.run_number }}
          body: |
            Automated SHRP recovery build.
            Device: pond
            Target: ${{ inputs.BUILD_TARGET }}
            Manifest branch: ${{ inputs.MANIFEST_BRANCH }}
            Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            Device tree commit: ${{ env.DEVICE_SHORT_COMMIT }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: artifacts/*
          
